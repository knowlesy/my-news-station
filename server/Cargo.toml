[package]
name        = "news-server"
version     = "0.1.0"
edition     = "2021"
description = "Axum web server for the Daily News Media Station"
license     = "MIT"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
# ── Web framework ─────────────────────────────────────────────────
axum        = { version = "0.8", features = ["macros"] }
tokio       = { version = "1",   features = ["full"] }

# ── Static file serving & middleware ─────────────────────────────
tower-http  = { version = "0.7", features = ["fs", "cors", "trace"] }
tower       = { version = "0.5" }

# ── Serialisation ─────────────────────────────────────────────────
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# ── Date/time ─────────────────────────────────────────────────────
chrono      = { version = "0.4", features = ["serde"] }

# ── Filesystem traversal ──────────────────────────────────────────
walkdir     = "2"

# ── Regex (file date extraction) ─────────────────────────────────
regex       = "1"

# ── Outbound HTTP (ntfy push notifications) ──────────────────────
# rustls rather than native-tls: no OpenSSL to link in the slim builder image.
reqwest     = { version = "0.12", default-features = false, features = ["rustls-tls"] }


# ── Structured logging ────────────────────────────────────────────
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }

# ── Kubernetes Job runner (SCRAPE_RUNNER=k8s) ────────────────────
# Always compiled in so the binary works in both local and k8s mode
# without separate builds.  kube uses rustls to avoid OpenSSL in the
# slim builder image (same reason as reqwest above).
kube        = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls"] }
k8s-openapi = { version = "0.28.0", features = ["v1_35"] }
futures     = "0.3"

[profile.release]
opt-level   = 3
lto         = true
codegen-units = 1
strip       = true   # Strip debug symbols → smaller binary
